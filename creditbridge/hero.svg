<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" role="img" aria-labelledby="t d">
<title id="t">CreditBridge illustration</title>
<desc id="d">A bridge carries cash gifts from a donor's home, through a Scholarship Granting Organization at the keystone, to a student's school, while a federal tax credit of up to $1,700 flows back to the donor.</desc>
<defs>
<linearGradient id="br" x1="0" x2="1"><stop offset="0" stop-color="#5eead4"/><stop offset=".55" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="deck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3a5c"/><stop offset="1" stop-color="#121a2e"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity=".18"/></linearGradient>
<linearGradient id="coin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
<linearGradient id="water" x1="0" x2="1"><stop offset="0" stop-color="#60a5fa" stop-opacity="0"/><stop offset=".5" stop-color="#60a5fa" stop-opacity=".45"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></linearGradient>
<linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e2b47"/><stop offset="1" stop-color="#111a2d"/></linearGradient>
<radialGradient id="g1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".38"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".34"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<radialGradient id="key" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#3b4f7a"/><stop offset="1" stop-color="#141d33"/></radialGradient>
<filter id="sh" filterUnits="userSpaceOnUse" x="0" y="0" width="560" height="480"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".55"/></filter>
<filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="560" height="480"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l7 4-7 4" fill="none" stroke="#5eead4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ah2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l7 4-7 4" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<path id="arc" d="M110 330 Q280 150 450 330"/>
</defs>
<style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.f1{animation:fl 7s ease-in-out infinite}.f2{animation:fl 8s ease-in-out -3s infinite}
.tw{animation:tw 3.2s ease-in-out infinite}.tw2{animation:tw 4s ease-in-out -1.5s infinite}
.dash{stroke-dasharray:4 6;animation:da 1.6s linear infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes da{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){.f1,.f2,.tw,.tw2,.dash{animation:none}.mv{display:none}}
</style>
<circle cx="150" cy="190" r="170" fill="url(#g1)"/>
<circle cx="430" cy="250" r="170" fill="url(#g2)"/>
<g opacity=".7"><path d="M40 404H520" stroke="url(#water)" stroke-width="1.5"/><path d="M90 418H470" stroke="url(#water)" stroke-width="1.2"/><path d="M150 432H410" stroke="url(#water)" stroke-width="1"/><path d="M210 446H350" stroke="url(#water)" stroke-width=".8"/></g>
<ellipse cx="280" cy="396" rx="250" ry="14" fill="#020617" opacity=".45"/>
