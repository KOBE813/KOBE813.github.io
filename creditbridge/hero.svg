<use href="#arc" fill="none" stroke="#60a5fa" stroke-opacity=".25" stroke-width="16" stroke-linecap="round"/>
<use href="#arc" fill="none" stroke="url(#br)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
<rect x="98" y="326" width="364" height="11" rx="5.5" fill="url(#deck)"/>
<rect x="98" y="326" width="364" height="2" rx="1" fill="#fff" opacity=".22"/>
<g class="mv">
<g><circle r="9.5" fill="url(#coin)" stroke="#fff7d6" stroke-opacity=".7"/><text y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#7c4a03">$</text><animateMotion dur="4.5s" repeatCount="indefinite" rotate="0"><mpath href="#arc"/></animateMotion></g>
<g><circle r="9.5" fill="url(#coin)" stroke="#fff7d6" stroke-opacity=".7"/><text y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#7c4a03">$</text><animateMotion dur="4.5s" begin="-1.5s" repeatCount="indefinite" rotate="0"><mpath href="#arc"/></animateMotion></g>
<g><circle r="9.5" fill="url(#coin)" stroke="#fff7d6" stroke-opacity=".7"/><text y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#7c4a03">$</text><animateMotion dur="4.5s" begin="-3s" repeatCount="indefinite" rotate="0"><mpath href="#arc"/></animateMotion></g>
</g>
<g filter="url(#sh)"><circle cx="280" cy="240" r="27" fill="url(#key)" stroke="url(#br)" stroke-width="2.5"/></g>
<g transform="translate(268 228)" fill="none" stroke="#e0f2fe" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 22h20M4 22V10l8-6 8 6v12M9 22v-5h6v5M9 12h.01M15 12h.01"/></g>
<g><rect x="250" y="186" width="60" height="22" rx="11" fill="#0b1324" stroke="url(#edge)"/><text x="280" y="201" text-anchor="middle" font-size="11" font-weight="700" letter-spacing=".08em" fill="#bae6fd">SGO</text></g>
