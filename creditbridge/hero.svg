<path d="M62 322s-11-6.5-11-14.6a6 6 0 0 1 11-3.4 6 6 0 0 1 11 3.4C73 315.5 62 322 62 322z" fill="#5eead4" filter="url(#glow)"/>
<rect x="38" y="350" width="48" height="20" rx="10" fill="#0b1324" stroke="url(#edge)"/><text x="62" y="364" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ccfbf1">You</text>
<ellipse cx="498" cy="340" rx="54" ry="10" fill="#a78bfa" opacity=".12"/>
<g filter="url(#sh)"><path d="M466 296h64v38a4 4 0 0 1-4 4h-56a4 4 0 0 1-4-4z" fill="url(#bldg)" stroke="#fff" stroke-opacity=".12"/><path d="M460 298l38-24 38 24z" fill="#1e2b47" stroke="url(#br)" stroke-width="3" stroke-linejoin="round"/></g>
<g stroke="#c4b5fd" stroke-opacity=".7" stroke-width="3" stroke-linecap="round"><path d="M478 306v22M490 306v22M506 306v22M518 306v22"/></g>
<path d="M498 274v-18" stroke="#c4b5fd" stroke-width="1.6"/><path d="M498 256h13l-3 4 3 4h-13z" fill="#a78bfa"/>
<rect x="470" y="350" width="56" height="20" rx="10" fill="#0b1324" stroke="url(#edge)"/><text x="498" y="364" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ede9fe">Student</text>
<g class="f1">
<g filter="url(#sh)"><rect x="18" y="58" width="214" height="104" rx="18" fill="#0d1628" fill-opacity=".86"/><rect x="18" y="58" width="214" height="104" rx="18" fill="url(#glass)" stroke="url(#edge)"/></g>
<circle cx="46" cy="88" r="12" fill="#2dd4bf" fill-opacity=".16" stroke="#5eead4" stroke-opacity=".5"/><path d="M41 88l3.5 3.5L51 85" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="66" y="92" font-size="12" font-weight="600" fill="#a5b4cf">Federal tax credit</text>
<text x="34" y="132" font-size="30" font-weight="800" letter-spacing="-.02em" fill="#f8fafc">−$1,700</text>
<text x="35" y="151" font-size="10.5" font-weight="500" fill="#7e8aa8">off what you owe · up to the cap</text>
</g>
<path class="dash" d="M92 168C104 200 76 222 68 248" fill="none" stroke="#5eead4" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<g class="f2">
<g filter="url(#sh)"><rect x="350" y="92" width="190" height="70" rx="16" fill="#0d1628" fill-opacity=".86"/><rect x="350" y="92" width="190" height="70" rx="16" fill="url(#glass)" stroke="url(#edge)"/></g>
<circle cx="377" cy="127" r="13" fill="#8b5cf6" fill-opacity=".18" stroke="#a78bfa" stroke-opacity=".55"/>
<g transform="translate(368 118) scale(.75)" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/></g>
<text x="400" y="122" font-size="11.5" font-weight="600" fill="#a5b4cf">Scholarship</text>
<text x="400" y="142" font-size="16" font-weight="800" fill="#f8fafc">funded</text>
</g>
<path class="dash" d="M470 168C486 196 498 222 498 250" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah2)"/>
<g fill="#e0f2fe"><path class="tw" d="M300 52l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/><path class="tw2" d="M520 46l1.5 4.5 4.5 1.5-4.5 1.5-1.5 4.5-1.5-4.5-4.5-1.5 4.5-1.5z"/><path class="tw2" d="M196 212l1.2 3.6 3.6 1.2-3.6 1.2-1.2 3.6-1.2-3.6-3.6-1.2 3.6-1.2z"/><path class="tw" d="M372 214l1.2 3.6 3.6 1.2-3.6 1.2-1.2 3.6-1.2-3.6-3.6-1.2 3.6-1.2z"/></g>
<g filter="url(#sh)"><rect x="64" y="416" width="432" height="40" rx="20" fill="#0d1628" fill-opacity=".86"/><rect x="64" y="416" width="432" height="40" rx="20" fill="url(#glass)" stroke="url(#edge)"/></g>
<g font-size="12" font-weight="700" fill="#e2e8f0" transform="translate(9 0)"><circle cx="90" cy="436" r="4.5" fill="#5eead4"/><text x="101" y="440">Cash gift</text><path d="M170 436h16m-5-4.5 5 4.5-5 4.5" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="202" cy="436" r="4.5" fill="#a78bfa"/><text x="213" y="440">Scholarship</text><path d="M296 436h16m-5-4.5 5 4.5-5 4.5" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="328" cy="436" r="4.5" fill="url(#coin)"/><text x="339" y="440">Up to <tspan fill="#fcd34d">$1,700</tspan> back</text></g>
